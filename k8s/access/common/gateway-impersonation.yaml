apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assessment-deployer-gateway-impersonation
rules:
  - apiGroups:
      - ""
    resourceNames:
      - ${ASSESSMENT_DEPLOYER_EMAIL}
    resources:
      - users
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assessment-deployer-gateway-impersonation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: assessment-deployer-gateway-impersonation
subjects:
  - kind: ServiceAccount
    name: connect-agent-sa
    namespace: gke-connect

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-a-nginx
  namespace: assessment
data:
  nginx.conf.template: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr info;

    events {}

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      fastcgi_temp_path /tmp/fastcgi;
      proxy_temp_path /tmp/proxy;
      scgi_temp_path /tmp/scgi;
      uwsgi_temp_path /tmp/uwsgi;

      server {
        listen 8080;
        server_name _;

        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }

        location = /app-a {
          add_header Content-Type text/plain;
          return 200 "app-a region=$ASSESSMENT_REGION\n";
        }

        location / {
          return 404;
        }
      }
    }

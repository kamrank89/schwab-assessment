[analytics]
check_for_updates = false
reporting_enabled = false

[auth.anonymous]
enabled = false

[dashboards]
versions_to_keep = 5

[log]
mode = console

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[security]
admin_user = admin
disable_gravatar = true

[server]
http_addr = 0.0.0.0
http_port = 3000
protocol = http

[users]
allow_sign_up = false

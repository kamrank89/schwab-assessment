apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: app-a-backend
  namespace: assessment
spec:
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    checkIntervalSec: 5
    healthyThreshold: 2
    port: 8080
    requestPath: /healthz
    timeoutSec: 5
    type: HTTP
    unhealthyThreshold: 2
  logging:
    enable: true
    sampleRate: 1.0
  securityPolicy:
    name: CLOUD_ARMOR_POLICY
